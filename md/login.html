<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>H'Leven Super Admin - Login</title>
    <!-- Material Symbols -->

    <!-- Google Fonts: Newsreader and Hanken Grotesk -->

    <style>
      .custom-shadow {
        box-shadow: 0 4px 20px rgba(47, 50, 49, 0.06);
      }
      .organic-shape-1 {
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }
      .organic-shape-2 {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }
      .organic-shape-3 {
        border-radius: 50% 50% 20% 80% / 25% 80% 20% 75%;
      }
    </style>
  </head>
  <body class="bg-surface-white min-h-screen antialiased text-on-surface">
    <main class="w-full min-h-screen flex flex-col md:flex-row">
      <!-- Left Section (Branding & Visuals) -->
      <div
        class="hidden md:flex w-1/2 bg-status-active relative overflow-hidden flex-col justify-center p-12 lg:p-24 z-0"
      >
        <!-- Abstract Fluid Shapes -->
        <div
          class="absolute -top-[10%] -left-[10%] w-[120%] h-[120%] opacity-20 pointer-events-none"
        >
          <div
            class="absolute top-0 left-0 w-[600px] h-[600px] bg-primary-fixed organic-shape-1 mix-blend-overlay"
          ></div>
          <div
            class="absolute bottom-10 right-0 w-[500px] h-[500px] bg-primary-container organic-shape-2 mix-blend-overlay"
          ></div>
          <div
            class="absolute top-1/4 left-1/4 w-[700px] h-[700px] bg-secondary-fixed organic-shape-3 mix-blend-overlay"
          ></div>
        </div>
        <!-- Dot Pattern -->
        <div class="absolute top-12 left-12 grid grid-cols-4 gap-2 opacity-30">
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-surface-white"></div>
        </div>
        <div class="relative z-10 max-w-lg mt-12">
          <h1
            class="font-headline-lg text-5xl lg:text-6xl text-surface-white mb-6 leading-tight font-bold"
          >
            Advanture<br />start here
          </h1>
          <p class="font-body-md text-surface-white/90 text-lg">
            Start Now – Create Your Account &amp; Join Our Team
          </p>
        </div>
      </div>
      <!-- Right Section (Login Form) -->
      <div
        class="w-full md:w-1/2 bg-surface-white flex flex-col justify-center items-center p-gutter sm:p-12 relative"
      >
        <div class="w-full max-w-[400px]">
          <!-- Logo / Branding -->
          <div class="text-center mb-12">
            <span
              class="font-headline-md text-3xl text-on-surface tracking-wider font-semibold"
              >H'LEVEN</span
            >
          </div>
          <!-- Form Header -->
          <div class="text-center mb-8">
            <h2 class="font-headline-lg text-4xl text-on-surface mb-3">
              Sign in
            </h2>
            <p class="font-body-sm text-outline">Grow Your Career With Us</p>
          </div>
          <!-- Form -->
          <form action="#" class="w-full flex flex-col gap-6" method="POST">
            <!-- Email Input Group -->
            <div class="flex flex-col gap-2 w-full">
              <label class="font-body-sm text-on-surface-variant" for="email"
                >Email Id</label
              >
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-4 text-outline-variant text-[20px]"
                  >mail</span
                >
                <input
                  class="w-full h-12 pl-12 pr-4 bg-surface-white border border-border-subtle rounded-lg font-body-md text-on-surface focus:outline-none focus:border-status-active focus:ring-1 focus:ring-status-active transition-colors placeholder:text-outline-variant"
                  id="email"
                  name="email"
                  placeholder="Enter your email address"
                  required=""
                  type="email"
                />
              </div>
            </div>
            <!-- Password Input Group -->
            <div class="flex flex-col gap-2 w-full">
              <label class="font-body-sm text-on-surface-variant" for="password"
                >Password</label
              >
              <div class="relative flex items-center">
                <span
                  class="material-symbols-outlined absolute left-4 text-outline-variant text-[20px]"
                  >lock</span
                >
                <input
                  class="w-full h-12 pl-12 pr-12 bg-surface-white border border-border-subtle rounded-lg font-body-md text-on-surface focus:outline-none focus:border-status-active focus:ring-1 focus:ring-status-active transition-colors placeholder:text-outline-variant"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  required=""
                  type="password"
                />
                <button
                  class="absolute right-4 text-outline-variant hover:text-on-surface transition-colors flex items-center justify-center"
                  type="button"
                >
                  <span class="material-symbols-outlined text-[20px]"
                    >visibility</span
                  >
                </button>
              </div>
            </div>
            <!-- Submit Button -->
            <button
              class="w-full h-12 mt-4 bg-status-active text-surface-white font-button-text text-button-text rounded-lg hover:bg-surface-tint transition-all duration-200 shadow-sm hover:shadow-md active:translate-y-[1px]"
              type="submit"
            >
              Sign in
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
