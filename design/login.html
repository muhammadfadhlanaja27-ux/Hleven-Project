<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">

<style>
        .material-symbols-outlined {
          font-family: 'Material Symbols Outlined';
          font-weight: normal;
          font-style: normal;
          font-size: 24px;
          line-height: 1;
          letter-spacing: normal;
          text-transform: none;
          display: inline-block;
          white-space: nowrap;
          word-wrap: normal;
          direction: ltr;
          -webkit-font-feature-settings: 'liga';
          -webkit-font-smoothing: antialiased;
        }
        
        .floating-input {
            position: relative;
        }
        
        .floating-input input {
            border: 1px solid #c4c8bf; /* outline-variant */
            background-color: transparent;
            transition: border-color 0.3s;
        }
        
        .floating-input input:focus {
            border-color: #778873; /* forest-green */
            outline: none;
            box-shadow: none;
        }
        
        .floating-input label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background-color: #ffffff;
            padding: 0 0.25rem;
            color: #747871; /* outline */
            transition: all 0.2s ease-out;
            pointer-events: none;
        }
        
        .floating-input input:focus ~ label,
        .floating-input input:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: 0.75rem;
            color: #778873; /* forest-green */
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface">
<main class="w-full max-w-[1000px] bg-surface-container-lowest rounded-xl shadow-sm shadow-forest-green/5 overflow-hidden flex flex-col md:flex-row relative z-10 border border-warm-beige/30">
<!-- Left Side: Image -->
<div class="hidden md:block md:w-1/2 relative bg-surface-dim">
<div class="absolute inset-0 bg-cover bg-center w-full h-full" data-alt="A breathtaking, high-quality photograph of a luxury resort infinity pool at golden hour. The calm water reflects a sophisticated, modern architectural facade bathed in warm, soft sunlight. The scene embodies quiet luxury and exclusivity, utilizing a sophisticated palette of muted earth tones, warm beige stone, and deep forest green foliage, perfectly aligning with a premium hospitality brand aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAfCNjjxx28HhcC3xlxBlcUYHFwteXxHdkx0F4GxqjUEbZFhPgMGpPhLuLUjkvbQ8eDR_zSSM-PzErM2OYg2LKkD05q7NfJVIdfbJL-XCrSA1PFPHf958zLIL4eD45818xKeR5rmIUCa7KRAw76tYHxI-uy46fZeDLnNXqajI68WnS7uPm-D1Dmw0kBx2Pn23h5Ma2pTNqGsfz_hvQ2g6q8w8YEQKlDlvtifknsQh1r7SRv5U4RQGbENQ')"></div>
<!-- Overlay for text readability if needed in future, currently empty for pure image display -->
<div class="absolute inset-0 bg-gradient-to-t from-on-background/20 to-transparent"></div>
</div>
<!-- Right Side: Form -->
<div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center bg-surface-container-lowest">
<!-- Brand Logo -->
<div class="mb-stack-lg flex items-center justify-center md:justify-start">
<span class="font-headline-md text-headline-md font-bold text-forest-green">H'Leven</span>
</div>
<!-- Heading -->
<div class="mb-stack-lg text-center md:text-left">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-stack-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to access your account.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Input -->
<div class="floating-input w-full">
<input class="w-full rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface" id="email" name="email" placeholder=" " required="" type="email">
<label class="font-label-md text-label-md" for="email">Email Address</label>
</div>
<!-- Password Input -->
<div class="floating-input w-full">
<input class="w-full rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface" id="password" name="password" placeholder=" " required="" type="password">
<label class="font-label-md text-label-md" for="password">Password</label>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-stack-sm">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-warm-beige text-forest-green focus:ring-forest-green bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-label-md text-label-md text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-forest-green hover:text-secondary-container transition-colors relative after:absolute after:bottom-0 after:left-0 after:h-[1px] after:w-0 after:bg-forest-green after:transition-all after:duration-300 hover:after:w-full" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack-md">
<button class="w-full flex justify-center py-3 px-4 rounded-DEFAULT text-on-primary bg-forest-green hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-forest-green transition-colors duration-200 font-label-md text-label-md shadow-[0_2px_4px_rgba(119,136,115,0.08)] hover:shadow-[0_4px_8px_rgba(119,136,115,0.12)] hover:-translate-y-[1px]" type="button">
                        Login
                    </button>
</div>
</form>
<!-- Registration Link -->
<div class="mt-stack-lg text-center font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-forest-green font-bold hover:text-secondary transition-colors underline decoration-warm-beige underline-offset-4 hover:decoration-forest-green" href="#">
                    Register
                </a>
</div>
</div>
</main>
</body></html>
